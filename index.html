<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patiwat Meekaeo — Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --primary: #0f2942;
      --primary-2: #1e3a5f;
      --accent: #c9a961;
      --accent-light: #e8d4a0;
      --text: #1a202c;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --border: #e2e8f0;
      --side-bg: #0f2942;
      --side-text: #e2e8f0;
      --side-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', 'Noto Sans Thai', 'Noto Sans SC', sans-serif;
      font-size: 14.5px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }

    /* Top bar */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; gap: 12px;
    }
    .admin-link {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      text-decoration: none; transition: all .2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .admin-link:hover { color: var(--primary); border-color: var(--primary); }
    .lang-switcher {
      margin-left: auto;
      display: flex; gap: 2px; background: var(--surface);
      padding: 4px; border-radius: 8px; border: 1px solid var(--border);
    }
    .lang-btn {
      background: transparent; border: 0; color: var(--muted);
      padding: 7px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .lang-btn:hover { color: var(--primary); }
    .lang-btn.active { background: var(--primary); color: #fff; }

    /* Resume Sheet */
    .sheet {
      background: var(--surface); border-radius: 14px; overflow: hidden;
      box-shadow: 0 20px 60px rgba(15,41,66,0.12), 0 4px 12px rgba(0,0,0,0.04);
      display: grid; grid-template-columns: 320px 1fr; min-height: 600px;
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      background: linear-gradient(165deg, var(--primary) 0%, var(--primary-2) 100%);
      color: var(--side-text); padding: 32px 28px;
      position: relative; overflow: hidden;
    }
    .sidebar::before {
      content: ''; position: absolute; top: -100px; right: -100px;
      width: 250px; height: 250px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,97,0.15) 0%, transparent 70%);
    }
    .sidebar::after {
      content: ''; position: absolute; bottom: -80px; left: -80px;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(201,169,97,0.1) 0%, transparent 70%);
    }
    .photo-wrap { text-align: center; margin-bottom: 22px; position: relative; z-index: 1; }
    .profile-photo {
      width: 150px; height: 150px; border-radius: 50%; object-fit: cover; object-position: center top;
      border: 4px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      background: #fff;
    }
    .photo-placeholder {
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 4px solid var(--accent);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 60px; color: var(--side-muted);
    }
    .side-name {
      font-family: 'Playfair Display', 'Noto Sans Thai', serif;
      font-size: 26px; font-weight: 700; color: #fff;
      text-align: center; line-height: 1.2; margin-bottom: 6px;
      position: relative; z-index: 1;
    }
    .side-title {
      text-align: center; color: var(--accent-light); font-size: 12px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 24px; padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      position: relative; z-index: 1;
    }
    .side-section { margin-bottom: 24px; position: relative; z-index: 1; }
    .side-section:last-child { margin-bottom: 0; }
    .side-h {
      font-size: 11px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(201,169,97,0.3);
      display: flex; align-items: center; gap: 8px;
    }
    .side-contact { font-size: 13px; }
    .side-contact-item {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 10px; color: var(--side-text);
    }
    .side-contact-item i { color: var(--accent); width: 14px; padding-top: 3px; flex-shrink: 0; font-size: 12px; }
    .side-contact-item a { color: var(--side-text); text-decoration: none; word-break: break-all; }
    .side-contact-item a:hover { color: var(--accent-light); }

    .side-skills-list { display: flex; flex-direction: column; gap: 14px; }
    .side-skill-group { font-size: 12px; }
    .side-skill-name {
      color: var(--accent); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .side-skill-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .side-skill-tag {
      background: rgba(201,169,97,0.12); color: var(--side-text);
      padding: 3px 9px; border-radius: 4px; font-size: 11px; font-weight: 500;
      border: 1px solid rgba(201,169,97,0.2);
    }

    /* ============ MAIN ============ */
    .main { padding: 36px 40px; background: #fff; }
    .main-section { margin-bottom: 32px; }
    .main-section:last-child { margin-bottom: 0; }
    .main-h {
      font-size: 13px; font-weight: 700; color: var(--primary);
      text-transform: uppercase; letter-spacing: 0.14em;
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
      display: flex; align-items: center; gap: 10px;
      position: relative;
    }
    .main-h::after {
      content: ''; position: absolute; bottom: -2px; left: 0;
      width: 60px; height: 2px; background: var(--accent);
    }
    .main-h i { color: var(--accent); font-size: 14px; }

    .summary { font-size: 14.5px; color: #334155; line-height: 1.75; text-align: justify; }

    /* Timeline */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px;
      width: 2px; background: linear-gradient(180deg, var(--primary) 0%, var(--accent) 100%);
    }
    .item { position: relative; margin-bottom: 26px; }
    .item:last-child { margin-bottom: 0; }
    .item::before {
      content: ''; position: absolute; left: -24px; top: 6px;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; border: 3px solid var(--accent);
      box-shadow: 0 0 0 4px #fff, 0 2px 8px rgba(201,169,97,0.4);
    }
    .item-header {
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 6px; margin-bottom: 4px;
    }
    .item-title { font-size: 15px; font-weight: 700; color: var(--primary); }
    .item-meta {
      font-size: 11px; color: var(--accent); font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      background: rgba(201,169,97,0.1); padding: 3px 9px; border-radius: 4px;
      border: 1px solid rgba(201,169,97,0.25);
    }
    .item-org {
      font-size: 13px; color: var(--muted); margin-bottom: 10px;
      font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }
    .item-org i { color: var(--primary-2); font-size: 11px; }
    .item-desc { font-size: 13.5px; color: #475569; }

    /* Rich content */
    .rich { font-size: 13.5px; color: #475569; }
    .rich-heading { font-weight: 700; color: var(--primary); margin-top: 12px; margin-bottom: 6px; font-size: 13.5px; }
    .rich-heading:first-child { margin-top: 0; }
    .rich-divider { border: 0; border-top: 1px dashed #cbd5e1; margin: 12px 0; }
    .rich-star { font-weight: 700; color: var(--primary); margin-bottom: 8px; font-size: 13.5px; }
    .rich-check { padding-left: 24px; position: relative; margin-bottom: 5px; }
    .rich-check::before {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; left: 4px; top: 2px; color: #16a34a; font-size: 11px;
    }
    .rich-arrow { padding-left: 24px; position: relative; margin-bottom: 5px; font-weight: 600; color: var(--primary); }
    .rich-arrow::before {
      content: '\f105'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; left: 8px; top: 0; color: var(--accent); font-size: 14px;
    }
    .rich-bullet { padding-left: 18px; position: relative; margin-bottom: 4px; }
    .rich-bullet::before {
      content: ''; position: absolute; left: 4px; top: 9px; width: 5px; height: 5px;
      background: var(--accent); border-radius: 50%;
    }
    .rich-sub { padding-left: 34px; position: relative; margin-bottom: 4px; font-size: 12.5px; color: #64748b; }
    .rich-sub::before { content: '•'; position: absolute; left: 22px; color: var(--muted-light); }
    .rich-section { font-weight: 700; color: var(--primary); margin-top: 14px; margin-bottom: 8px; font-size: 13.5px; padding-left: 4px; border-left: 3px solid var(--accent); padding-left: 10px; }
    .rich-text { margin-bottom: 5px; }

    /* Highlight box */
    .highlight-box {
      background: linear-gradient(135deg, #fef9e7 0%, #fef3c7 100%);
      border-left: 4px solid var(--accent);
      padding: 16px 18px; border-radius: 8px; margin-top: 14px;
      box-shadow: 0 2px 8px rgba(201,169,97,0.15);
    }
    .highlight-box .highlight-title {
      font-weight: 700; color: var(--primary); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .highlight-box .highlight-title i { color: var(--accent); }
    .highlight-box .rich { color: #475569; }
    .highlight-box .rich-heading { color: var(--primary); }
    .highlight-box .rich-section { color: var(--primary-2); }

    /* Certs */
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .cert-item {
      background: #f8fafc; padding: 12px 14px; border-radius: 8px;
      font-size: 13px; color: var(--text); border: 1px solid var(--border);
      transition: all .2s; display: flex; align-items: flex-start; gap: 11px;
    }
    .cert-item.clickable { cursor: pointer; }
    .cert-item.clickable:hover {
      background: #fff; border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(201,169,97,0.15); transform: translateY(-1px);
    }
    .cert-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: var(--accent); display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(15,41,66,0.2);
    }
    .cert-text { flex: 1; min-width: 0; }
    .cert-name { font-weight: 700; color: var(--primary); font-size: 13px; line-height: 1.3; margin-bottom: 3px; }
    .cert-org { color: var(--muted); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; }
    .cert-badge {
      display: inline-flex; align-items: center; gap: 3px;
      background: #16a34a; color: #fff; padding: 1px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; margin-left: 4px; text-transform: uppercase;
    }

    footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--muted-light); padding: 12px; }

    /* Animations */
    .fade-in { animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .loading { text-align: center; padding: 120px 20px; color: var(--muted); font-size: 14px; }

    @media (max-width: 880px) {
      .container { padding: 12px; }
      .sheet { grid-template-columns: 1fr; }
      .sidebar { padding: 28px 24px; }
      .main { padding: 28px 24px; }
      .side-name { font-size: 22px; }
    }
    @media print {
      body { background: #fff; }
      .top-bar { display: none; }
      .container { padding: 0; max-width: 100%; }
      .sheet { box-shadow: none; border-radius: 0; grid-template-columns: 290px 1fr; }
      .item, .main-section { page-break-inside: avoid; }
    }

    /* Cert preview modal */
    .preview-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.92); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
    .preview-modal.open { display: flex; }
    .preview-content { position: relative; max-width: 95vw; max-height: 95vh; display: flex; flex-direction: column; }
    .preview-close { position: absolute; top: -44px; right: 0; background: rgba(255,255,255,0.15); border: 0; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; backdrop-filter: blur(8px); transition: all .2s; }
    .preview-close:hover { background: rgba(255,255,255,0.25); }
    .preview-content img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 12px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .preview-content iframe { width: 90vw; height: 90vh; border: 0; border-radius: 12px; background: #fff; }
    .preview-caption { color: #fff; text-align: center; margin-top: 14px; font-size: 14px; font-weight: 600; }
    .preview-actions { text-align: center; margin-top: 8px; }
    .preview-actions a { color: var(--accent-light); text-decoration: none; font-size: 13px; padding: 6px 14px; margin: 0 4px; border-radius: 8px; transition: all .2s; }
    .preview-actions a:hover { background: rgba(255,255,255,0.1); color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="admin/" class="admin-link" id="adminLink" style="display:none;"><i class="fa-solid fa-gear"></i> Admin</a>
      <div class="lang-switcher" role="group">
        <button class="lang-btn active" data-lang="th">ไทย</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>
    </div>
    <div id="app"><div class="loading">Loading…</div></div>
  </div>

  <div class="preview-modal" id="previewModal" onclick="closePreview(event)">
    <div class="preview-content" id="previewContent" onclick="event.stopPropagation()">
      <button class="preview-close" onclick="closePreview()"><i class="fa-solid fa-xmark"></i></button>
      <div id="previewBody"></div>
      <div class="preview-caption" id="previewCaption"></div>
      <div class="preview-actions" id="previewActions"></div>
    </div>
  </div>

  <script>
    let DATA = null;
    let CURRENT_LANG = 'th';

    async function loadData() {
      const res = await fetch('resume-data.json?t=' + Date.now());
      DATA = await res.json();
    }

    function t(obj) { return obj.translations[CURRENT_LANG] || obj.translations.th; }
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    function renderRichLine(raw) {
      const line = (raw || '').trim();
      if (!line) return '';
      if (/^[━─=]{3,}$/.test(line)) return '<hr class="rich-divider" />';
      if (/^[🔹🔸◆◇►▪]/u.test(line)) return '<div class="rich-section">' + escapeHtml(line.replace(/^[🔹🔸◆◇►▪]\s*/u, '')) + '</div>';
      if (/^★/.test(line)) return '<div class="rich-star">★ ' + escapeHtml(line.replace(/^★\s*/, '')) + '</div>';
      if (/^[✓✔]/.test(line)) return '<div class="rich-check">' + escapeHtml(line.replace(/^[✓✔]\s*/, '')) + '</div>';
      if (/^[➤►▶]/.test(line)) return '<div class="rich-arrow">' + escapeHtml(line.replace(/^[➤►▶]\s*/, '')) + '</div>';
      if (/^\d+\.\s/.test(line)) return '<div class="rich-heading">' + escapeHtml(line) + '</div>';
      if (/^[•○]\s/.test(line)) return '<div class="rich-sub">' + escapeHtml(line.replace(/^[•○]\s*/, '')) + '</div>';
      if (/^[-*–]\s/.test(line)) return '<div class="rich-bullet">' + escapeHtml(line.replace(/^[-*–]\s*/, '')) + '</div>';
      return '<div class="rich-bullet">' + escapeHtml(line) + '</div>';
    }

    function renderRichLines(items) {
      const rawLines = Array.isArray(items) ? items : String(items || '').split('\n');
      const processed = [];
      for (const raw of rawLines) {
        const line = (raw || '').trim();
        if (!line) continue;
        const numMatches = line.match(/(?:^|\s)\d+\.\s/g) || [];
        if (numMatches.length >= 2) {
          line.split(/(?=\s\d+\.\s)/).forEach(p => { const t = p.trim(); if (t) processed.push(t); });
          continue;
        }
        const checkMatches = line.match(/(?:^|\s)[✓✔]\s/g) || [];
        if (checkMatches.length >= 2) {
          line.split(/(?=\s[✓✔]\s)/).forEach(p => { const t = p.trim(); if (t) processed.push(t); });
          continue;
        }
        const arrMatches = line.match(/(?:^|\s)[➤►▶]\s/g) || [];
        if (arrMatches.length >= 2) {
          line.split(/(?=\s[➤►▶]\s)/).forEach(p => { const t = p.trim(); if (t) processed.push(t); });
          continue;
        }
        processed.push(line);
      }
      return '<div class="rich">' + processed.map(renderRichLine).join('') + '</div>';
    }

    function render() {
      const p = t(DATA.personal);
      const L = DATA.labels[CURRENT_LANG] || DATA.labels.th;

      const html = `
        <div class="sheet fade-in">
          <!-- ===== SIDEBAR ===== -->
          <aside class="sidebar">
            <div class="photo-wrap">
              ${DATA.personal.photo
                ? `<img class="profile-photo" src="${escapeAttr(DATA.personal.photo)}" alt="${escapeAttr(p.name)}" />`
                : `<div class="photo-placeholder"><i class="fa-solid fa-user"></i></div>`}
            </div>
            <div class="side-name">${escapeHtml(p.name)}</div>
            <div class="side-title">${escapeHtml(p.title)}</div>

            <div class="side-section">
              <div class="side-h"><i class="fa-solid fa-address-card"></i> ${CURRENT_LANG==='th'?'ติดต่อ':CURRENT_LANG==='en'?'Contact':'联系方式'}</div>
              <div class="side-contact">
                <div class="side-contact-item"><i class="fa-solid fa-envelope"></i><a href="mailto:${escapeAttr(DATA.personal.email)}">${escapeHtml(DATA.personal.email)}</a></div>
                <div class="side-contact-item"><i class="fa-solid fa-phone"></i><a href="tel:${escapeAttr(DATA.personal.phone)}">${escapeHtml(DATA.personal.phone)}</a></div>
                <div class="side-contact-item"><i class="fa-solid fa-location-dot"></i><span>${escapeHtml(p.location)}</span></div>
                <div class="side-contact-item"><i class="fa-solid fa-cake-candles"></i><span>${escapeHtml(p.dob)}</span></div>
              </div>
            </div>

            <div class="side-section">
              <div class="side-h"><i class="fa-solid fa-bolt"></i> ${escapeHtml(L.skillsTitle)}</div>
              <div class="side-skills-list">
                ${DATA.skills.map(s => `
                  <div class="side-skill-group">
                    <div class="side-skill-name">${escapeHtml(t(s).label)}</div>
                    <div class="side-skill-tags">${(s.tags||[]).map(tg => `<span class="side-skill-tag">${escapeHtml(tg)}</span>`).join('')}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </aside>

          <!-- ===== MAIN ===== -->
          <main class="main">
            <section class="main-section">
              <h2 class="main-h"><i class="fa-solid fa-user"></i> ${escapeHtml(L.summaryTitle)}</h2>
              <p class="summary">${escapeHtml(p.summary)}</p>
            </section>

            <section class="main-section">
              <h2 class="main-h"><i class="fa-solid fa-briefcase"></i> ${escapeHtml(L.experienceTitle)}</h2>
              <div class="timeline">
                ${DATA.experience.map(item => {
                  const it = t(item);
                  return `
                    <div class="item">
                      <div class="item-header">
                        <div class="item-title">${escapeHtml(it.title)}</div>
                        <div class="item-meta"><i class="fa-regular fa-calendar"></i> ${escapeHtml(it.meta)}</div>
                      </div>
                      <div class="item-org"><i class="fa-solid fa-building"></i> ${escapeHtml(it.org)}</div>
                      <div class="item-desc">${renderRichLines(it.bullets || [])}</div>
                      ${it.highlight ? `
                        <div class="highlight-box">
                          <div class="highlight-title"><i class="fa-solid fa-trophy"></i> ${escapeHtml(L.keyResult)}</div>
                          ${renderRichLines(it.highlight)}
                        </div>` : ''}
                    </div>`;
                }).join('')}
              </div>
            </section>

            <section class="main-section">
              <h2 class="main-h"><i class="fa-solid fa-graduation-cap"></i> ${escapeHtml(L.educationTitle)}</h2>
              <div class="timeline">
                ${DATA.education.map(item => {
                  const it = t(item);
                  return `
                    <div class="item">
                      <div class="item-header">
                        <div class="item-title">${escapeHtml(it.title)}</div>
                        <div class="item-meta"><i class="fa-regular fa-calendar"></i> ${escapeHtml(it.meta)}</div>
                      </div>
                      <div class="item-org"><i class="fa-solid fa-school"></i> ${escapeHtml(it.org)}</div>
                    </div>`;
                }).join('')}
              </div>
            </section>

            <section class="main-section">
              <h2 class="main-h"><i class="fa-solid fa-certificate"></i> ${escapeHtml(L.certsTitle)}</h2>
              <div class="cert-grid">
                ${DATA.certs.map(c => {
                  const tc = t(c);
                  const hasFile = !!c.file;
                  return `
                    <div class="cert-item${hasFile?' clickable':''}" ${hasFile?`onclick="previewCert('${escapeAttr(c.file)}','${escapeAttr(tc.name)}')"`:''}>
                      <div class="cert-icon"><i class="fa-solid fa-award"></i></div>
                      <div class="cert-text">
                        <div class="cert-name">${escapeHtml(tc.name)}${hasFile ? '<span class="cert-badge"><i class="fa-solid fa-eye"></i> View</span>' : ''}</div>
                        <div class="cert-org"><i class="fa-solid fa-building-columns"></i> ${escapeHtml(tc.org)}</div>
                      </div>
                    </div>`;
                }).join('')}
              </div>
            </section>
          </main>
        </div>
        <footer>${escapeHtml(L.footer)}</footer>
      `;
      document.getElementById('app').innerHTML = html;
      document.documentElement.lang = CURRENT_LANG;
    }

    function previewCert(filePath, certName) {
      const ext = filePath.split('.').pop().toLowerCase();
      const body = document.getElementById('previewBody');
      const caption = document.getElementById('previewCaption');
      const actions = document.getElementById('previewActions');
      if (['jpg','jpeg','png','webp'].includes(ext)) {
        body.innerHTML = `<img src="${filePath}" alt="${escapeAttr(certName)}" />`;
      } else if (ext === 'pdf') {
        body.innerHTML = `<iframe src="${filePath}#view=FitH" title="${escapeAttr(certName)}"></iframe>`;
      } else {
        body.innerHTML = `<div style="background:#fff;padding:40px;border-radius:8px;text-align:center;">ไม่รองรับไฟล์ประเภทนี้</div>`;
      }
      caption.textContent = certName;
      actions.innerHTML = `<a href="${filePath}" target="_blank" download><i class="fa-solid fa-download"></i> Download</a> · <a href="${filePath}" target="_blank"><i class="fa-solid fa-up-right-from-square"></i> Open New Tab</a>`;
      document.getElementById('previewModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closePreview(e) {
      if (e && e.target.id !== 'previewModal' && e.type !== undefined) return;
      document.getElementById('previewModal').classList.remove('open');
      document.getElementById('previewBody').innerHTML = '';
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

    function applyLang(lang) {
      CURRENT_LANG = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      render();
      try { localStorage.setItem('resume-lang', lang); } catch (e) {}
    }

    (async function init() {
      try { await loadData(); }
      catch (e) {
        document.getElementById('app').innerHTML = '<div class="loading">⚠️ ไม่สามารถโหลด resume-data.json ได้</div>';
        return;
      }
      let initLang = 'th';
      try { const saved = localStorage.getItem('resume-lang'); if (saved && DATA.labels[saved]) initLang = saved; } catch (e) {}
      document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => applyLang(btn.dataset.lang)));
      applyLang(initLang);
    // Show admin link only when on localhost (Docker)
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      const adminLink = document.getElementById('adminLink');
      if (adminLink) adminLink.style.display = 'inline-flex';
    }

    })();
  </script>
</body>
</html>
